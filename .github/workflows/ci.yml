name: research-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m coverage run --source=backend/app -m unittest discover -s backend/tests -v
      - run: python -m coverage report --show-missing --fail-under=80
      - run: python -m coverage report --include='*/analytics.py,*/etl.py,*/ledger.py' --fail-under=80
      - run: docker compose config --quiet
        env:
          API_KEY: ci-configuration-validation-only
      - run: docker build -t vietlot-test backend
